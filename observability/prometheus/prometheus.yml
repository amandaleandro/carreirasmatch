global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # App Next.js - métricas de processo Node + contadores de negócio.
  - job_name: carreiras-app
    metrics_path: /api/metrics
    static_configs:
      - targets: ["carreiras-match-app:3000"]
    # Se você setar METRICS_TOKEN no .env do app, descomente para autenticar:
    # authorization:
    #   type: Bearer
    #   credentials: "COLE_AQUI_O_METRICS_TOKEN"

  # Caddy - taxa de requests, códigos de status e latência na borda.
  - job_name: caddy
    static_configs:
      - targets: ["carreiras-match-caddy:9180"]

  # Métricas de containers (CPU/memória/rede/IO por container).
  - job_name: cadvisor
    static_configs:
      - targets: ["carreiras-match-cadvisor:8080"]

  # Métricas do host (CPU, memória, disco, rede, load).
  - job_name: node-exporter
    static_configs:
      - targets: ["carreiras-match-node-exporter:9100"]

  - job_name: loki
    static_configs:
      - targets: ["carreiras-match-loki:3100"]
