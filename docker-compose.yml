name: carreiras-match

services:
  postgres:
    image: postgres:17-alpine
    container_name: carreiras-match-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-carreiras}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=${POSTGRES_DB:-carreiras_match}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-carreiras} -d ${POSTGRES_DB:-carreiras_match}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - default

  app:
    build:
      context: .
      args:
        # Embutidas no bundle do cliente em build time (ver Dockerfile).
        NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY:-}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
        NEXT_PUBLIC_PLAUSIBLE_SRC: ${NEXT_PUBLIC_PLAUSIBLE_SRC:-}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
        NEXT_PUBLIC_ADSENSE_SLOT_BLOG_ARTICLE: ${NEXT_PUBLIC_ADSENSE_SLOT_BLOG_ARTICLE:-}
        NEXT_PUBLIC_ADSENSE_SLOT_BLOG_LIST: ${NEXT_PUBLIC_ADSENSE_SLOT_BLOG_LIST:-}
        NEXT_PUBLIC_ADSENSE_SLOT_TOOL_GUIDE: ${NEXT_PUBLIC_ADSENSE_SLOT_TOOL_GUIDE:-}
    container_name: carreiras-match-app
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-nano}
      - AI_ROUTING_MODE=${AI_ROUTING_MODE:-free_first}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-carreiras}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-carreiras_match}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=${APP_URL:-https://carreirasmatch.com.br}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - INDEED_JOBS_ENABLED=${INDEED_JOBS_ENABLED:-}
      - JOOBLE_API_KEY=${JOOBLE_API_KEY:-}
      - JOOBLE_JOBS_ENABLED=${JOOBLE_JOBS_ENABLED:-}
      - JOB_FEED_AUTOFETCH_ENABLED=${JOB_FEED_AUTOFETCH_ENABLED:-}
      - JOB_FEED_RUN_TIMES=${JOB_FEED_RUN_TIMES:-}
      - JOB_FEED_QUERIES=${JOB_FEED_QUERIES:-}
      - EXTERNAL_SOURCES_SYNC_ENABLED=${EXTERNAL_SOURCES_SYNC_ENABLED:-true}
      - EXTERNAL_SOURCES_RUN_TIMES=${EXTERNAL_SOURCES_RUN_TIMES:-08:00,14:00,20:00}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - FEED_MATCH_BATCH_SIZE=${FEED_MATCH_BATCH_SIZE:-20}
      - JOB_RETENTION_DAYS=${JOB_RETENTION_DAYS:-45}
      - GUPY_COMPANIES=${GUPY_COMPANIES:-}
      - SOLIDES_COMPANIES=${SOLIDES_COMPANIES:-}
      - GLASSDOOR_PARTNER_ID=${GLASSDOOR_PARTNER_ID:-}
      - GLASSDOOR_PARTNER_KEY=${GLASSDOOR_PARTNER_KEY:-}
      - GREENHOUSE_BOARDS=${GREENHOUSE_BOARDS:-}
      - LEVER_COMPANIES=${LEVER_COMPANIES:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY=${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET}
      - APP_URL=${APP_URL:-https://carreirasmatch.com.br}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - GROQ_MODEL=${GROQ_MODEL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${NEXT_PUBLIC_PLAUSIBLE_DOMAIN:-}
      - NEXT_PUBLIC_PLAUSIBLE_SRC=${NEXT_PUBLIC_PLAUSIBLE_SRC:-}
      - NEXT_PUBLIC_ADSENSE_CLIENT=${NEXT_PUBLIC_ADSENSE_CLIENT:-}
      - NEXT_PUBLIC_ADSENSE_SLOT_BLOG_ARTICLE=${NEXT_PUBLIC_ADSENSE_SLOT_BLOG_ARTICLE:-}
      - NEXT_PUBLIC_ADSENSE_SLOT_BLOG_LIST=${NEXT_PUBLIC_ADSENSE_SLOT_BLOG_LIST:-}
      - NEXT_PUBLIC_ADSENSE_SLOT_TOOL_GUIDE=${NEXT_PUBLIC_ADSENSE_SLOT_TOOL_GUIDE:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0}
      # Trava opcional do /api/metrics (vazia = sem trava; ver observability/README.md).
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Provedores de IA extras (multi-provedor com fallback) - ligam ao setar a chave.
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - CEREBRAS_MODEL=${CEREBRAS_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY:-}
      - TOGETHER_MODEL=${TOGETHER_MODEL:-}
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY:-}
      - DEEPINFRA_MODEL=${DEEPINFRA_MODEL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-2}
      - AI_REQUEST_TIMEOUT_MS=${AI_REQUEST_TIMEOUT_MS:-45000}
      - LIFECYCLE_EMAILS_ENABLED=${LIFECYCLE_EMAILS_ENABLED:-true}
      - LIFECYCLE_WHATSAPP_ENABLED=${LIFECYCLE_WHATSAPP_ENABLED:-false}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE:-}
      - EVOLUTION_WEBHOOK_SECRET=${EVOLUTION_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default

  caddy:
    image: caddy:2-alpine
    container_name: carreiras-match-caddy
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - edge_net

  # Evolution API (gateway self-hosted de WhatsApp) para a régua de conversão
  # via WhatsApp. Banco e cache próprios, isolados do Postgres principal, pra
  # não misturar dado de produto com estado de sessão do WhatsApp. Desligado
  # por padrão (perfil "whatsapp"): só sobe com
  # `docker compose --profile whatsapp up -d`, depois que EVOLUTION_* estiver
  # no .env. Pareamento inicial exige escanear o QR code com o celular da
  # linha dedicada (passo manual, feito uma vez via túnel SSH).
  evolution-postgres:
    image: postgres:17-alpine
    container_name: carreiras-match-evolution-postgres
    restart: unless-stopped
    profiles: ["whatsapp"]
    environment:
      - POSTGRES_USER=evolution
      # ":?" quebraria o parse do compose para TODOS os serviços (mesmo fora
      # do profile ativo) se a env faltasse — soft default aqui, quem sobe de
      # verdade é o `--profile whatsapp up`, que falha em runtime sem senha.
      - POSTGRES_PASSWORD=${EVOLUTION_POSTGRES_PASSWORD:-}
      - POSTGRES_DB=evolution
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - evolution-postgres-data:/var/lib/postgresql/data
    networks:
      - default

  evolution-redis:
    image: redis:7-alpine
    container_name: carreiras-match-evolution-redis
    restart: unless-stopped
    profiles: ["whatsapp"]
    volumes:
      - evolution-redis-data:/data
    networks:
      - default

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    container_name: carreiras-match-evolution-api
    restart: unless-stopped
    profiles: ["whatsapp"]
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_POSTGRES_PASSWORD}@evolution-postgres:5432/evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379
      - WEBHOOK_GLOBAL_URL=${APP_URL:-https://carreirasmatch.com.br}/api/whatsapp/webhook?token=${EVOLUTION_WEBHOOK_SECRET}
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
    volumes:
      - evolution-instances:/evolution/instances
    depends_on:
      evolution-postgres:
        condition: service_healthy
    networks:
      - default
    # Não exposto via Caddy/internet de propósito: só o container `app` fala
    # com ele (rede interna). Pareamento inicial do QR e administração são
    # feitos via túnel SSH.

  postgres-backup:
    image: postgres:17-alpine
    container_name: carreiras-match-postgres-backup
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - BACKUP_DIR=/backups
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - PGHOST=postgres
      - PGUSER=${POSTGRES_USER:-carreiras}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB:-carreiras_match}
    volumes:
      - ${SQLITE_BACKUP_HOST_DIR:-./backups}:/backups
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    command: ["/bin/sh", "/usr/local/bin/backup-postgres.sh"]
    networks:
      - default

volumes:
  postgres-data:
  caddy-data:
    name: carreiras-match_caddy-data
  caddy-config:
    name: carreiras-match_caddy-config
  evolution-postgres-data:
  evolution-redis-data:
  evolution-instances:

networks:
  default:
    name: carreiras-match_default
  edge_net:
    external: true
